<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1f4b">
<title>Maths 5</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1f4b;--gold:#c9a227;--gold2:#f0d475;--paper:#f3f2ea;--ink:#1c2130;--green:#1e7a3a;--amber:#d98a1a;--grey:#6f7686;--white:#fff;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3,.disp{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-weight:400;letter-spacing:.02em;margin:0}
.top{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:calc(10px + var(--sat)) 16px 10px;display:flex;align-items:center;gap:12px}
.top img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:center 20%;border:2px solid var(--gold2)}
.top .t{flex:1;line-height:1.1}.top .t b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;font-weight:400;letter-spacing:.03em}.top .t span{font-size:12px;color:#c9d0e3;font-weight:700}
.top .pts{font-family:'Bebas Neue',Impact,sans-serif;font-size:28px;color:var(--gold2)}.top .pts small{font-family:'Nunito';font-size:10px;display:block;text-align:right;color:#c9d0e3;margin-top:-4px}
.dots{display:flex;gap:5px;padding:8px 16px 0;background:var(--navy)}.dots i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.2)}.dots i.on{background:var(--gold2)}.dots i.done{background:var(--green)}
.screen{display:none;padding:18px 16px calc(96px + var(--sab));max-width:560px;margin:0 auto}.screen.on{display:block}
h2{font-size:38px;color:var(--navy);line-height:.95}.kicker{font-size:13px;font-weight:900;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
p{margin:0 0 12px}.lead{color:#4b5263}
.card{background:#fff;border-radius:16px;padding:16px 18px;margin:12px 0;box-shadow:0 3px 14px rgba(11,31,75,.06)}
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:22px 18px;margin:12px 0}.hero h2{color:#fff;font-size:44px}.hero p{color:#dfe4f2}.hero .avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:center 20%;border:4px solid var(--gold2);display:block;margin:0 auto 12px}
.plan{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}.plan div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 4px;text-align:center;font-size:11px;font-weight:700}.plan b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-size:18px;font-weight:400;color:var(--gold2)}
/* replay */
.replay{background:#111a33;color:#fff;border-radius:16px;padding:16px;margin:12px 0;border:2px solid var(--gold)}.replay h3{color:var(--gold2);font-size:20px;margin-bottom:8px}
.replay .lab{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--gold2);margin:8px 0 2px}.replay .bad{font-family:'Caveat',cursive;font-size:23px;color:#ffb3a7;line-height:1.25}.replay .good{font-family:'Caveat',cursive;font-size:23px;color:#b9f0c4;line-height:1.25}.replay .rule{font-size:14px;color:#dfe4f2;border-top:1px solid rgba(255,255,255,.15);padding-top:8px;margin-top:10px}
.decision{display:grid;grid-template-columns:1fr 1fr;gap:10px}.decision div{background:#111a33;color:#fff;border-radius:12px;padding:12px;text-align:center}.decision b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-size:34px;font-weight:400;color:var(--gold2);line-height:1}.decision span{font-size:12px}
/* story */
.story{background:#fbf6e4;border-radius:16px;padding:20px 18px;margin:12px 0;border:1px solid #e6dcb5;font-size:17px;line-height:1.65}.story h3{font-size:28px}.story .ep{color:var(--grey);font-weight:900;font-size:13px;margin-bottom:12px}.story .diary{font-family:'Caveat',cursive;font-size:23px;line-height:1.4;color:#2b2b2b}.story mark{background:#fff0b3;padding:0 3px;border-radius:3px;font-weight:700}.sp{background:#dce8ff;padding:0 3px;border-radius:3px}
.rules ol{margin:6px 0 0;padding-left:20px}.rules li{margin:6px 0}code{font-family:'Nunito';background:#eef1f8;padding:1px 6px;border-radius:5px;font-weight:900}
/* quiz */
.qwrap{margin-top:8px}.qno{font-size:13px;font-weight:900;color:var(--grey)}.qt{font-weight:900;font-size:18px;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e2e1d8;border-radius:14px;padding:14px 16px;margin:8px 0;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.opt:active{transform:scale(.99)}.opt.correct{background:#d9f0de;border-color:var(--green)}.opt.wrong{background:#ffe6bf;border-color:var(--amber)}.opt:disabled{opacity:1}
.why{display:none;margin-top:10px;padding:12px 14px;border-radius:12px;background:#eef1f8;font-size:15px}.why.show{display:block}.why b{color:var(--navy)}
/* words */
.word{background:var(--navy);color:#fff;border-radius:16px;padding:16px 18px;margin:10px 0}.word .disp{font-size:30px;color:var(--gold2);line-height:1}.word .pos{font-size:12px;color:#c9d0e3;font-weight:700;margin:2px 0 8px}.word p{margin:0 0 6px;font-size:15px}.word em{color:#dfe4f2}
/* write */
.prompt{background:#fff8dc;border-left:6px solid var(--gold);padding:14px 16px;border-radius:0 12px 12px 0;margin:12px 0}.prompt ul{margin:8px 0 0;padding-left:20px}.prompt li{margin:4px 0}
.notebook{background:#fff;border-radius:14px;padding:12px 16px;margin:10px 0;border:2px dashed var(--gold)}.notebook .lab{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--gold)}.notebook .bad{font-family:'Caveat',cursive;font-size:23px;color:#a33;line-height:1.25}
.timerbar{display:flex;gap:12px;align-items:center;margin:12px 0}.timer{font-family:'Bebas Neue',Impact,sans-serif;font-size:40px;color:var(--navy);min-width:96px}
.check label{display:flex;gap:12px;align-items:center;background:#fff;padding:13px 14px;border-radius:12px;margin:8px 0;border:2px solid transparent;font-size:15px;font-weight:700}.check label:has(input:checked){border-color:var(--green);background:#d9f0de}.check input{width:22px;height:22px;accent-color:var(--green);flex:none}.check label.ref{background:#fff8dc;border-color:var(--gold)}.check label.ref:has(input:checked){background:#f0d475}
/* full time */
.ft{background:var(--navy);color:#fff;border-radius:18px;padding:22px 18px;text-align:center}.ft .total{font-family:'Bebas Neue',Impact,sans-serif;font-size:76px;color:var(--gold2);line-height:1}.ft .lv{font-size:14px;color:#c9d0e3;margin-top:4px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.rgrid div{background:rgba(255,255,255,.1);border-radius:10px;padding:10px}.rgrid b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-size:30px;font-weight:400;color:var(--gold2);line-height:1}.rgrid span{font-size:12px;font-weight:700}
.bar{height:10px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:var(--gold2)}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(243,242,234,.96);backdrop-filter:blur(8px);border-top:1px solid #dedcd0;padding:10px 16px calc(10px + var(--sab));display:flex;gap:10px;justify-content:space-between;align-items:center}
.btn{font:inherit;font-weight:900;font-size:16px;border:none;border-radius:999px;padding:14px 22px;background:var(--navy);color:#fff;cursor:pointer;flex:1;max-width:280px}.btn.gold{background:var(--gold);color:var(--navy)}.btn.ghost{background:transparent;color:var(--navy);flex:0;padding:14px 12px}.btn:disabled{opacity:.4}
.note{font-size:14px;color:var(--grey)}

.main{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.main div{border-radius:14px;padding:12px;background:#fff;border-top:6px solid var(--gold)}.main b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;font-weight:400;color:var(--navy);line-height:1}.main span{font-size:13px}.main .fb{display:block;margin-top:6px;font-size:12px;color:var(--green);font-weight:900}
.m1{border-top-color:#c8382c!important}.m2{border-top-color:#1e7a3a!important}.m3{border-top-color:#d9a41a!important}.m4{border-top-color:#6b4fbb!important}
.pe{background:#fff;border-radius:14px;padding:14px 16px;margin:10px 0;border-left:6px solid var(--navy)}.pe .lab{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--navy)}
.model{display:none;margin-top:10px;background:#eef1f8;border-radius:12px;padding:12px 14px;font-size:15px}.model.show{display:block}

.lesson{background:#fff;border-radius:16px;padding:16px 18px;margin:12px 0;border-top:6px solid var(--navy)}.lesson h3{font-size:22px;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.grid2 div{background:#eef1f8;border-radius:10px;padding:10px;font-size:14px;font-weight:700}.grid2 b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;font-weight:400;color:var(--navy);line-height:1}
.ex{background:#fff8dc;border-left:5px solid var(--gold);padding:8px 12px;border-radius:0 10px 10px 0;margin:8px 0;font-size:15px}

.fact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.fact div{background:#fff;border-radius:12px;padding:12px;border-top:5px solid var(--red,#c8382c)}.fact b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;font-weight:400;color:var(--navy);line-height:1}.fact span{font-size:13px}
.exp{background:#e8f4ea;border:2px dashed var(--green);border-radius:14px;padding:14px 16px;margin:12px 0}.exp ol{margin:6px 0 0;padding-left:20px}.exp li{margin:5px 0}
.bank{background:#fff;border-radius:14px;padding:12px 14px;margin:8px 0}.bank h4{margin:0 0 6px;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:20px;color:var(--navy)}.bank .chips span{display:inline-block;background:#eef1f8;border-radius:8px;padding:4px 9px;margin:3px 3px 0 0;font-size:14px;font-weight:700}
</style>
</head>

const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

 inv_mul:{name:"Missing number (×)",make(){const a=[6,7,8,9,11,12][R(0,5)],c=R(13,48);return{q:`☐ × ${a} = ${fmt(a*c)}`,a:c,w:`Inverse: undo × with ÷. ${fmt(a*c)} ÷ ${a} = ${c}.`}}},

 quarter:{name:"0.25 ×",make(){const n=4*R(6,60);return{q:`0.25 × ${n}`,a:n/4,w:`0.25 = a quarter: halve, then halve again. ${n} → ${n/2} → ${n/4}.`}}},

 fdiv:{name:"Fraction ÷ whole",make(){const b=R(3,9),c=R(2,6);let a=R(1,b-1);while(gcd(a,b)>1)a=R(1,b-1);const d=b*c,g=gcd(a,d);return{q:`${a}/${b} ÷ ${c}`,a:a/d,frac:true,disp:`${a}/${d}`,w:`Keep the top, multiply the bottom: ${a}/${b} ÷ ${c} = ${a}/(${b}×${c}) = ${a}/${d}${g>1?` = ${a/g}/${d/g}`:""}. Either ${a}/${d} or the simplified form counts.`}}},
 ldiv:{name:"Long division",make(){const e=R(12,59),qq=R(21,89);return{q:`${fmt(e*qq)} ÷ ${e}`,a:qq,w:`Build the ${e} times-table first (×1, ×2, ×5, ×10). ${e} × ${qq} = ${fmt(e*qq)}, so the answer is ${qq}.`}}},

function parse(s){s=(s||"").replace(/,/g,"").replace(/\s+/g," ").trim();let m;
 if((m=s.match(/^(-?\d+) (\d+)\/(\d+)$/)))return +m[1]+ +m[2]/ +m[3];
 if((m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/)))return +m[1]/ +m[2];
 if(/^-?\d*\.?\d+$/.test(s))return +s;return NaN;}
function render(){if(i>=ITEMS.length)return end();const it=ITEMS[i];
 document.getElementById("box").innerHTML=`<div class="card"><div class="qno">Sum ${i+1} of 5 · ${TYPES[it.t].name}</div>
 <div style="font-family:'Bebas Neue',Impact,sans-serif;font-size:44px;letter-spacing:1px;text-align:center;margin:14px 0">${it.q} =</div>
 <input id="ans" inputmode="decimal" autocomplete="off" placeholder="${it.frac?"e.g. 3/20":"your answer"}" style="width:100%;font-size:26px;padding:12px;border-radius:12px;border:2px solid #c9d0e3;text-align:center;box-sizing:border-box" onkeydown="if(event.key==='Enter')check()">
 <button class="btn gold" id="chk" style="width:100%;max-width:none;margin-top:10px" onclick="check()">Shoot</button>
 <div class="why" id="why"></div><button class="btn" id="nx" style="display:none;width:100%;max-width:none;margin-top:12px" onclick="i++;render()">${i<4?"Next ›":"Finish ›"}</button></div>`;
 setTimeout(()=>{const e=document.getElementById("ans");if(e)e.focus()},50);}
function check(){const it=ITEMS[i];const el=document.getElementById("ans");const v=parse(el.value);if(el.value.trim()===""||isNaN(v)){el.style.borderColor="#e0a030";return;}
 el.disabled=true;document.getElementById("chk").style.display="none";A.seen[it.t]=(A.seen[it.t]||0)+1;const w=document.getElementById("why");
 if(Math.abs(v-it.a)<1e-6){score++;A.missed=A.missed.filter(t=>t!==it.t);el.style.borderColor="#2e9d5b";w.innerHTML="<b>⚽ Goal!</b> "+it.w;}
 else{el.style.borderColor="#d64545";if(!A.missed.includes(it.t))A.missed.push(it.t);wrongT.push(it.t);w.innerHTML=`<b>🧤 Saved.</b> The answer is <b>${it.disp||fmt(it.a)}</b>. ${it.w} <i>(This type comes back tomorrow.)</i>`;}
 w.classList.add("show");document.getElementById("nx").style.display="block";document.getElementById("livePts").textContent=score*10;sv(AK,A);}
function end(){document.getElementById("box").style.display="none";document.getElementById("intro").style.display="none";document.getElementById("end").style.display="block";
 if(!A.last.done){A.last.done=true;A.last.score=score;A.last.wrong=wrongT;sv(AK,A);
  const st=ld(KEY,{days:{}});st.days["aw-"+TODAY]={n:100,date:TODAY,title:"Maths 5",total:score*10+(score===5?10:0),kind:"warmup",words:[],sections:{"Sums":score+"/5","Missed":wrongT.map(t=>TYPES[t].name).join(", ")||"none"}};sv(KEY,st);}
 const sc=A.last.score;document.getElementById("score").textContent=sc+"/5";document.getElementById("livePts").textContent=sc*10+(sc===5?10:0);
 document.getElementById("msg").innerHTML=sc===5?"Clean sheet: +10 bonus. Now the main match.":sc>=3?"Good. The types you missed come back tomorrow.":"Tough one. Look at the tips again, then kick off.";}
if(A.last.done){i=5;end();}else render();
const COACH_WHATSAPP="447341974350";
/* send to Baba as a file: phones open the share sheet → WhatsApp → Baba; a file never gets cut short like pasted text */
async function shareText(text,tag){
 const day=new Date().toISOString().slice(0,10);
 const base="yigit-"+(tag||(typeof MD!=="undefined"&&MD.id)||"report")+"-"+day;
 const tries=[new File([text],base+".json",{type:"application/json"}),new File([text],base+".txt",{type:"text/plain"})];
 for(const f of tries){try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:base});return;}}catch(e){if(e&&e.name==="AbortError")return;}}
 const f=tries[0];const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>{location.href="https://wa.me/"+COACH_WHATSAPP+"?text="+encodeURIComponent("📎 "+f.name+" downloaded. Attach it here.")},900);
}

function sendToBaba(){const d=ld(KEY,{days:{}}).days["aw-"+TODAY];const rep={app:"ya-season",type:"warmup-report",id:"aw-"+TODAY,date:TODAY,title:"Maths 5",total:d?d.total:0,sections:d?d.sections:{},items:ITEMS.map(x=>x.q+" = "+(x.disp||fmt(x.a)))};shareText(JSON.stringify(rep,null,1),"aw");}
</script>
